name: Build Arch Linux Package (Daily)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_RELEASE_DEBUG: "false"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
      RUSTFLAGS: "-C debuginfo=0 -C codegen-units=1"
      NODE_OPTIONS: "--max-old-space-size=3072"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update system and install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            git nodejs pnpm rust wasm-pack \
            webkit2gtk-4.1 gtk3 libappindicator-gtk3 librsvg patchelf \
            mpv ffmpeg yt-dlp openssl file curl wget \
            sudo fakeroot

      - name: Create non-root user for makepkg
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

      - name: Configure makepkg to use disk instead of tmpfs
        run: |
          echo "BUILDDIR=/tmp/makepkg" >> /etc/makepkg.conf
          mkdir -p /tmp/makepkg
          chown builder:builder /tmp/makepkg

      - name: Prepare PKGBUILD
        run: |
          pkgver=$(date +%Y%m%d)
          sed -i "s/pkgver=.*/pkgver=$pkgver/" packaging/PKGBUILD
          cp packaging/PKGBUILD /home/builder/
          chown builder:builder /home/builder/PKGBUILD

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: /home/builder/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
            /home/builder/harbor/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build package
        run: |
          su builder -c "cd /home/builder && makepkg -s --noconfirm"

      - name: Find built package
        id: find_package
        run: |
          pkgfile=$(ls /home/builder/*.pkg.tar.zst | head -n 1)
          echo "pkgfile=$pkgfile" >> $GITHUB_OUTPUT
          echo "pkgname=$(basename $pkgfile)" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: harbor-arch-package
          path: ${{ steps.find_package.outputs.pkgfile }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: daily-${{ github.run_number }}
          name: "Daily Build ${{ github.run_number }}"
          body: |
            Build giornaliera del pacchetto Arch Linux per Harbor.
            Data: ${{ github.event.repository.updated_at }}
          files: ${{ steps.find_package.outputs.pkgfile }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
